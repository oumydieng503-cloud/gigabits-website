databases:
  - name: gigabits-db
    plan: free
    databaseName: gigabits
    user: gigabits

services:
  - type: web
    name: gigabits-website
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: GIGABITS SARL
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Africa/Dakar
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        fromDatabase:
          name: gigabits-db
          property: connectionString
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: gigabitssarl@gmail.com
      - key: MAIL_FROM_ADDRESS
        value: gigabitssarl@gmail.com
      - key: MAIL_FROM_NAME
        value: GIGABITS SARL
      - key: MAIL_CONTACT_TO
        value: gigabitssarl@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: SESSION_SECURE_COOKIE
        value: "true"
