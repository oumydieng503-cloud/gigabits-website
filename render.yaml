services:
  - type: web
    name: gigabits-website
    runtime: docker
    plan: free
    healthCheckPath: /up
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_NAME
        value: GIGABITS SARL
      - key: APP_KEY
        generateValue: true
      - key: APP_TIMEZONE
        value: Africa/Dakar
      - key: APP_LOCALE
        value: fr
      - key: APP_FALLBACK_LOCALE
        value: fr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: SESSION_DRIVER
        value: file
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: LOG_CHANNEL
        value: stderr
      - key: MAIL_MAILER
        value: smtp
      - key: MAIL_SCHEME
        value: smtp
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        value: gigabitssarl@gmail.com
      - key: MAIL_FROM_ADDRESS
        value: gigabitssarl@gmail.com
      - key: MAIL_FROM_NAME
        value: GIGABITS SARL
      - key: MAIL_CONTACT_TO
        value: gigabitssarl@gmail.com
      - key: MAIL_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_SECURE_COOKIE
        value: "true"
